<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="./styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sistema Escolar</title>
  </head>
  <body>
    <!-- Botões para trocar de aba -->
    <div class="tabs-container">
      <button
        class="tab-button active"
        id="btn-cadastrar"
        onclick="cadastrar()"
      >
        Cadastrar
      </button>
      <button class="tab-button" id="btn-listar" onclick="listar()">
        Listar Alunos
      </button>
    </div>

    <!-- Conteúdo da Aba 1: Cadastrar -->
    <div id="tab-cadastrar" class="tab-content active">

      <h3>Cadastrar Turma</h3>
    
      Nome do curso:
      <input id="nomeCurso" type="text" />
    
      Nome do professor:
      <input id="nomeProfessor" type="text" />
    
      Matrícula do professor:
      <input id="matriculaProfessor" type="text" />
    
      <button onclick="salvarTurma()" class="btn-salvar">
        Cadastrar Turma
      </button>
    
      <hr>
    
      <h3>Cadastrar Aluno</h3>
    
      Nome:
      <input id="nome" type="text" />
    
      Matrícula:
      <input id="matricula" type="text" />
    
      Turma:
      <select id="turmaAluno">
        <option value="">Cadastre uma turma primeiro</option>
      </select>
    
      Nota 1:
      <input id="n1" type="number" min="0" max="10" step="0.01" />
    
      Nota 2:
      <input id="n2" type="number" min="0" max="10" step="0.01" />
    
      Nota 3:
      <input id="n3" type="number" min="0" max="10" step="0.01" />
    
      <button onclick="salvar()" class="btn-salvar">
        Salvar Aluno
      </button>
    
    </div>

    <!-- Conteúdo da Aba 2: Listar -->
    <div id="tab-listar" class="tab-content">
      <h3>Alunos Cadastrados</h3>
      <ul class="lista-alunos" id="alunos">
        <!-- O JavaScript vai colocar os alunos aqui depois -->
        <li>Nenhum aluno cadastrado ainda.</li>
      </ul>
    </div>

    <script src="./Pessoa.js" defer></script>
    <script src="./Aluno.js" defer></script>
    <script src="./Professor.js" defer></script>
    <script src="./Turma.js" defer></script>
    <script src="./script.js" defer></script>
    
  </body>
</html>
